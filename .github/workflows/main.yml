name: Build NeoTerraForged

on:
  workflow_dispatch:
  push:
    branches:
      - 1.21.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: NeoTerraForged-build
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
